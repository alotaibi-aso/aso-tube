name: Library data refresh

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh = update stats of existing videos only (monthly default). add-channels = fetch channels added to channels.json. seed = rebuild from the published data, then add-channels. full = refetch everything."
        type: choice
        options: [refresh, add-channels, seed, full]
        default: refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached library data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Update library data (YouTube Data API)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MODE: ${{ inputs.mode || 'refresh' }}
        run: |
          if [ "$MODE" = "seed" ] || { [ "$MODE" != "full" ] && [ ! -d data/raw/channels ]; }; then
            python pipeline/seed_from_published.py
          fi
          case "$MODE" in
            seed|add-channels) python pipeline/yt_api.py channels
                               python pipeline/yt_api.py reddit ;;
            full)              python pipeline/yt_api.py all --force ;;
            *)                 [ -f data/raw/reddit_videos_meta.jsonl ] || python pipeline/yt_api.py reddit
                               python pipeline/yt_api.py refresh ;;
          esac

      - name: Save library data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: Build site
        env:
          ASO_OUT: "."
        run: |
          python pipeline/build_data.py --public
          cp site_src/index.html index.html
          rm -f aso-tube-data.zip
          zip -qj aso-tube-data.zip videos.json pipeline/*.py pipeline/*.json

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html videos.json aso-tube-data.zip
          git diff --cached --quiet || { git commit -m "Library data refresh"; git push; }
